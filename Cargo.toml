[package]
name = "dynamic-group-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
pest = "2.1"
pest_derive = "2.1"

# For Axum webserver
axum = "0.8.6"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net"] }

# Serde for JSON
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

